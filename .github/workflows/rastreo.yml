name: Rastreo de Vinilos

on:
  schedule:
    # Cada 2 horas (hora UTC)
    - cron: '0 */2 * * *'
  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Enviar un mensaje de prueba a Telegram al empezar'
        type: boolean
        default: true

# Necesario para guardar vistos.json (la memoria) en el repositorio
permissions:
  contents: write

# Evita que dos ejecuciones se pisen al guardar la memoria
concurrency:
  group: rastreo-vinilos
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar Rastreador
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          TEST_TELEGRAM: ${{ github.event.inputs.test_telegram == 'true' && '1' || '0' }}
          PYTHONUNBUFFERED: '1'
        run: python cazador_vinilos.py

      - name: Guardar memoria y discos comprados
        if: always()
        run: |
          if [ -n "$(git status --porcelain vistos.json discos.json)" ]; then
            git config user.name "cazador-vinilos-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vistos.json discos.json
            git commit -m "Actualizar anuncios avisados y discos comprados [skip ci]"
            git pull --rebase
            git push
          else
            echo "Sin cambios que guardar."
          fi
